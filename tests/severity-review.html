<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Severity-coding review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #d8dce2; --ink: #1c2128;
    --muted: #5b6573; --accent: #2563eb; --warn: #b45309; --bad: #b91c1c; --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .agreement { margin-left: auto; color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 47px); }
  aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
  aside .controls { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .item { padding: 7px 10px; border-bottom: 1px solid #eef0f3; cursor: pointer; font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .item:hover { background: #f0f4ff; }
  .item.active { background: #e0e9ff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #cbd2db; }
  .dot.done { background: var(--ok); }
  .dot.full { background: var(--warn); }
  .dot.done.full { background: var(--ok); }
  .item .q { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  main { overflow-y: auto; padding: 16px 20px 60px; }
  .qline { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .sub .tag { display: inline-block; background: #eef0f3; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
  .sub .tag.full { background: #fde68a; color: #78350f; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; max-height: 50vh; }
  .pane h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .pane .body { padding: 12px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .srclabels { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .srclabels code { background: #eef0f3; border-radius: 3px; padding: 0 4px; }
  .claude { margin-top: 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; }
  .claude h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #1e40af; margin: 0 0 8px; }
  .claude .tier { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 5px; margin-bottom: 8px; }
  .claude .tier.S0 { background: #e5e7eb; color: #374151; }
  .claude .tier.S1 { background: #fed7aa; color: #7c2d12; }
  .claude .tier.S2 { background: #fecaca; color: #7f1d1d; }
  .claude .tier.REJECT { background: #bbf7d0; color: #14532d; }
  .claude .direction { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 5px; margin: 0 0 8px 8px; }
  .claude .direction.misuse { background: #fecaca; color: #7f1d1d; }
  .claude .direction.disuse { background: #bfdbfe; color: #1e3a8a; }
  .claude .direction.neutral { background: #e5e7eb; color: #374151; }
  .directionpick { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .directionpick.shown { display: block; }
  .directionpick h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .directionpick .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .directionpick label { border: 2px solid var(--border); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; user-select: none; }
  .directionpick input { display: none; }
  .directionpick label:has(input:checked) { border-color: var(--accent); background: #e0e9ff; }
  .halluc { margin-top: 8px; }
  .halluc ul { margin: 4px 0 0; padding-left: 18px; }
  .halluc li { color: var(--bad); }
  .none { color: var(--ok); }
  .priorlabel { margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .priorlabel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  form.score { margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  form.score h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .tierpick { display: flex; gap: 8px; flex-wrap: wrap; }
  .tierpick label { border: 2px solid var(--border); border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; user-select: none; }
  .tierpick input { display: none; }
  .tierpick label:has(input:checked) { border-color: var(--accent); background: #e0e9ff; }
  .field { margin-top: 12px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
  .field textarea, .field input { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; }
  .field textarea { min-height: 44px; resize: vertical; }
  .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  button { font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 8px 16px; }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--border); }
  .status { color: var(--muted); font-size: 12px; }
  .reviewerline { font-size: 12px; color: var(--muted); }
  .reviewerline input { width: 140px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Severity-coding review</h1>
  <span class="meta" id="meta"></span>
  <span class="agreement" id="agreement"></span>
</header>

<div class="layout">
  <aside>
    <div class="controls">
      <label><input type="checkbox" id="hideReviewed" /> Hide reviewed</label>
      <label><input type="checkbox" id="fullOnly" /> Full-review only</label>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
const TIERS = ["S0", "S1", "S2", "REJECT"];
const TIER_LABELS = { S0: "S0 — Immaterial", S1: "S1 — Operational (control/procedure)", S2: "S2 — Calibration-relevant", REJECT: "Not a hallucination — reject" };
const DIRECTIONS = ["misuse", "disuse", "neutral"];
const DIRECTION_LABELS = {
  misuse: "Misuse-directed — overstates capability / weakens vigilance (over-trust risk)",
  disuse: "Disuse-directed — overstates a limitation / extra caution (under-trust, self-correcting)",
  neutral: "Neutral — wrong, but no clear directional lean",
};

let session = null;
let entries = [];
let current = 0;

const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function load() {
  session = await (await fetch("/api/session")).json();
  entries = session.entries;
  document.getElementById("meta").textContent = `reviewer: ${session.reviewer}  ·  ${entries.length} entries`;
  renderAgreement();
  const firstPending = entries.findIndex((e) => !e.finalSeverity);
  current = firstPending === -1 ? 0 : firstPending;
  renderList();
  renderEntry();
}

function renderAgreement() {
  const el = document.getElementById("agreement");
  el.textContent = `reviewed ${session.reviewed}/${session.total}  ·  agreed with Claude's proposal ${session.agreed}/${session.reviewed || 0}`;
}

function visibleIndices() {
  const hide = document.getElementById("hideReviewed").checked;
  const fullOnly = document.getElementById("fullOnly").checked;
  return entries.map((e, i) => i).filter((i) => {
    const e = entries[i];
    if (hide && e.finalSeverity) return false;
    if (fullOnly && e.reviewType !== "full") return false;
    return true;
  });
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  visibleIndices().forEach((i) => {
    const e = entries[i];
    const div = document.createElement("div");
    div.className = "item" + (i === current ? " active" : "");
    div.innerHTML = `<span class="dot ${e.reviewType === "full" ? "full" : ""} ${e.finalSeverity ? "done" : ""}"></span>
      <span>#${esc(e.taskId)}</span>
      <span class="q">${esc(e.question)}</span>`;
    div.onclick = () => { current = i; renderList(); renderEntry(); };
    list.appendChild(div);
  });
}

function sourceHtml(e) {
  let labels = "";
  if (e.retrieved && e.retrieved.length) {
    labels = `<div class="srclabels">${e.retrieved.length} passage(s): ` +
      e.retrieved.map((r) => `<code>${esc(r.file)}${r.passage ? " — " + esc(r.passage) : ""}</code>`).join(" ") +
      `</div>`;
  } else if (e.docOrder && e.docOrder.length) {
    labels = `<div class="srclabels">${e.docOrder.length} doc(s): ` +
      e.docOrder.map((d) => `<code>${esc(d)}</code>`).join(" ") + `</div>`;
  }
  const body = e.context && e.context.trim() ? esc(e.context) : "(no source text logged)";
  return labels + `<div class="body">${body}</div>`;
}

function judgeHtml(claims) {
  return (claims ?? []).length
    ? `<div class="halluc"><b>Claims the judge flagged:</b><ul>${claims.map((h) => `<li>${esc(h)}</li>`).join("")}</ul></div>`
    : `<div class="halluc"><span class="none">No claims flagged.</span></div>`;
}

function priorLabelHtml(e) {
  if (!e.priorHumanLabel) {
    return `<div class="priorlabel"><h2>Your earlier review</h2><span class="none">No prior review exists for this entry — it's from a run made after your review census, so both the confirm/reject call and the tier are new (this is a "full review" entry).</span></div>`;
  }
  const hl = e.priorHumanLabel;
  const claims = (hl.hallucinations ?? []).length
    ? `<ul>${hl.hallucinations.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>`
    : `<span class="none">You found no hallucination here.</span>`;
  return `<div class="priorlabel"><h2>Your earlier review (already in review-sample_batch3.json)</h2>
    <div>Scores — helpfulness ${hl.helpfulness}, groundedness ${hl.groundedness}, safety ${hl.safety}, calibration ${hl.calibration}</div>
    <div style="margin-top:6px"><b>Claim(s) you confirmed:</b></div>${claims}</div>`;
}

function renderEntry() {
  const e = entries[current];
  const fs = e.finalSeverity;
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="qline">${esc(e.question)}</div>
    <div class="sub">
      <span class="tag">#${esc(e.taskId)}</span>
      <span class="tag">${esc(e.category ?? "uncategorized")}</span>
      <span class="tag">${esc(e.suite)}</span>
      <span class="tag">mode: ${esc(e.mode)}</span>
      <span class="tag ${e.reviewType === "full" ? "full" : ""}">${e.reviewType === "full" ? "FULL REVIEW — no prior human label" : "tier-only — you already confirmed this claim"}</span>
    </div>

    <div class="split">
      <div class="pane">
        <h2>Response</h2>
        <div class="body">${esc(e.response)}</div>
      </div>
      <div class="pane">
        <h2>Source material</h2>
        ${sourceHtml(e)}
      </div>
    </div>

    ${judgeHtml(e.judgeHallucinations)}
    ${priorLabelHtml(e)}

    <div class="claude">
      <h2>Claude's proposal</h2>
      <div class="tier ${e.claudeProposedTier}">${TIER_LABELS[e.claudeProposedTier]}</div>
      ${e.claudeProposedDirection ? `<div class="direction ${e.claudeProposedDirection}">${DIRECTION_LABELS[e.claudeProposedDirection].split(" — ")[0]}</div>` : ""}
      <div>${esc(e.claudeReasoning)}</div>
      ${e.claudeDirectionReasoning ? `<div style="margin-top:6px"><b>Direction reasoning:</b> ${esc(e.claudeDirectionReasoning)}</div>` : ""}
    </div>

    <form class="score" id="scoreForm">
      <h2>Your call ${fs ? "· already reviewed (resubmit to overwrite)" : ""}</h2>
      <div class="tierpick">
        ${TIERS.map((t) => `<label><input type="radio" name="tier" value="${t}" ${(fs ? fs.tier : e.claudeProposedTier) === t ? "checked" : ""}>${TIER_LABELS[t]}</label>`).join("")}
      </div>
      <div class="directionpick" id="directionpick">
        <h3>If S2 — risk direction (Parasuraman &amp; Riley 1997 misuse/disuse; Lee &amp; See 2004)</h3>
        <div class="row">
          ${DIRECTIONS.map((d) => `<label><input type="radio" name="direction" value="${d}" ${((fs ? fs.direction : e.claudeProposedDirection) || "") === d ? "checked" : ""}>${DIRECTION_LABELS[d]}</label>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>Note (optional — why you agreed/disagreed)</label>
        <textarea name="note">${fs ? esc(fs.note ?? "") : ""}</textarea>
      </div>
      <div class="reviewerline field">
        <label>Reviewer</label>
        <input name="reviewer" value="${esc((fs && fs.reviewer) || session.reviewer)}" />
      </div>
      <div class="actions">
        <button type="submit">Save &amp; next →</button>
        <button type="button" class="secondary" id="skipBtn">Skip</button>
        <span class="status" id="formStatus"></span>
      </div>
    </form>
  `;
  document.getElementById("scoreForm").onsubmit = onSubmit;
  document.getElementById("skipBtn").onclick = next;
  const tierRadios = document.querySelectorAll('input[name="tier"]');
  const directionBox = document.getElementById("directionpick");
  const syncDirectionVisibility = () => {
    const selected = document.querySelector('input[name="tier"]:checked');
    directionBox.classList.toggle("shown", !!selected && selected.value === "S2");
  };
  tierRadios.forEach((r) => r.addEventListener("change", syncDirectionVisibility));
  syncDirectionVisibility();
}

function next() {
  const vis = visibleIndices();
  const pos = vis.indexOf(current);
  const nextPending = vis.slice(pos + 1).find((i) => !entries[i].finalSeverity);
  if (nextPending !== undefined) { current = nextPending; }
  else if (pos + 1 < vis.length) { current = vis[pos + 1]; }
  renderList();
  renderEntry();
}

async function onSubmit(ev) {
  ev.preventDefault();
  const f = ev.target;
  const note = f.note.value;
  const reviewer = f.reviewer.value.trim();
  const sel = f.querySelector('input[name="tier"]:checked');
  if (!sel) {
    document.getElementById("formStatus").textContent = "Pick a tier.";
    return;
  }
  let direction = null;
  if (sel.value === "S2") {
    const dirSel = f.querySelector('input[name="direction"]:checked');
    if (!dirSel) {
      document.getElementById("formStatus").textContent = "S2 needs a risk direction (misuse / disuse / neutral).";
      return;
    }
    direction = dirSel.value;
  }
  const res = await fetch(`/api/label/${encodeURIComponent(entries[current].taskId)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tier: sel.value, direction, note, reviewer }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    document.getElementById("formStatus").textContent = "Error: " + (err.error || res.status);
    return;
  }
  const { finalSeverity, reviewed, agreed, total } = await res.json();
  entries[current].finalSeverity = finalSeverity;
  session.reviewed = reviewed; session.agreed = agreed; session.total = total;
  renderAgreement();
  next();
}

document.getElementById("hideReviewed").onchange = renderList;
document.getElementById("fullOnly").onchange = renderList;
load();
</script>
</body>
</html>

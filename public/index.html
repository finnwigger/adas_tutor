<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADAS Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pre-drive">
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>ADAS ASSIST</span>
      </div>

      <section class="sidebar-section">
        <div class="section-label">DRIVER</div>
        <div class="driver-selector">
          <input
            type="text"
            id="user-input"
            placeholder="Search or enter name…"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="user-dropdown" class="user-dropdown" hidden></ul>
        </div>
      </section>

      <section class="sidebar-section dashboard">
        <div class="section-label">KNOWLEDGE PROFILE</div>
        <div id="topics-list" class="topics-list">
          <div class="no-driver-msg">Select a driver to view profile</div>
        </div>
      </section>

      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="pre-drive">
          <span class="mode-pip"></span>PRE-DRIVE
        </button>
        <button class="mode-btn" data-mode="in-drive">
          <span class="mode-pip"></span>IN-DRIVE
        </button>
      </div>
    </aside>

    <!-- Chat -->
    <main class="chat">
      <header class="chat-header">
        <div class="header-left">
          <span class="mode-badge" id="mode-badge">PRE-DRIVE</span>
          <span class="header-user" id="header-user">No driver selected</span>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="tts-btn" title="Toggle voice output">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
          <button class="icon-btn" id="clear-btn" title="Clear conversation">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="system-msg" id="welcome-msg">
          Select a driver profile to begin.
        </div>
      </div>

      <div class="input-bar">
        <button class="mic-btn" id="mic-btn" title="Voice input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0M12 19v3M9 22h6"/>
          </svg>
        </button>
        <input
          type="text"
          id="chat-input"
          placeholder="Select a driver to start chatting…"
          disabled
        />
        <button class="send-btn" id="send-btn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </main>

  </div>
  <!-- Onboarding modal -->
  <div id="ob-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="ob-progress-bar" id="ob-progress" style="width:0%"></div>
      <div id="ob-body" class="ob-body"></div>
      <div id="ob-footer" class="ob-footer"></div>
    </div>
  </div>

  <script type="module" src="chat-ui.js"></script>
</body>
</html>
